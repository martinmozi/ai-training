<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .title { font-size:20px; font-weight:600; fill:#0f172a; }
    .small { font-size:12px; fill:#334155; }
    .w { fill:#fff; font-size:12px; font-weight:600; }
  </style>
  <text x="450" y="32" text-anchor="middle" class="title">Prompt caching: platí sa za prefix, ktorý sa nezmenil</text>

  <g transform="translate(40,60)">
    <text x="0" y="16" font-weight="600">Ťah N</text>
    <rect x="80"  y="0" width="120" height="26" fill="#334155"/><text x="140" y="17" text-anchor="middle" class="w">tools</text>
    <rect x="200" y="0" width="120" height="26" fill="#7c3aed"/><text x="260" y="17" text-anchor="middle" class="w">system + CLAUDE.md</text>
    <rect x="320" y="0" width="300" height="26" fill="#16a34a"/><text x="470" y="17" text-anchor="middle" class="w">história správ 1…N</text>

    <text x="0" y="66" font-weight="600">Ťah N+1</text>
    <rect x="80"  y="50" width="540" height="26" fill="#94a3b8"/><text x="350" y="67" text-anchor="middle" class="w">cache read (~10 % ceny vstupu)</text>
    <rect x="620" y="50" width="90" height="26" fill="#f59e0b"/><text x="665" y="67" text-anchor="middle" class="w">nové</text>

    <text x="0" y="126" font-weight="600" fill="#dc2626">Zmena</text>
    <rect x="80"  y="110" width="120" height="26" fill="#94a3b8"/><text x="140" y="127" text-anchor="middle" class="w">cache hit</text>
    <rect x="200" y="110" width="510" height="26" fill="#dc2626"/><text x="455" y="127" text-anchor="middle" class="w">všetko od zmeny ďalej = cache write (~125 %)</text>
    <text x="200" y="152" class="small">napr. editácia CLAUDE.md, pridanie MCP servera, prepnutie modelu, zmena system promptu uprostred session</text>

    <text x="0" y="200" class="small">Pravidlá: cache je prefixová (poradie tools → system → messages), TTL typicky 5 min (Anthropic aj 1 h),</text>
    <text x="0" y="218" class="small">každá zmena v prefixe zneplatní všetko za ňou. Prestávka nad TTL = ďalší ťah zaplatí celý kontext znova.</text>
  </g>
</svg>

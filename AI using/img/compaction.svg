<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .title { font-size:20px; font-weight:600; fill:#0f172a; }
    .h { font-size:14px; font-weight:700; fill:#0f172a; }
    .small { font-size:12px; fill:#334155; }
    .w { fill:#fff; font-size:12px; font-weight:600; }
  </style>
  <text x="450" y="32" text-anchor="middle" class="title">Čo zostane v kontexte po kompakcii (Claude Code)</text>

  <text x="40" y="70" class="h">Pred kompakciou</text>
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="60" height="230" fill="#334155"/>
    <text x="30" y="118" text-anchor="middle" class="w" transform="rotate(-90 30 118)">systém + nástroje</text>
    <rect x="60" y="0" width="40" height="230" fill="#7c3aed"/>
    <text x="80" y="118" text-anchor="middle" class="w" transform="rotate(-90 80 118)">CLAUDE.md + memory</text>
    <rect x="100" y="0" width="230" height="230" fill="#16a34a"/>
    <text x="215" y="40" text-anchor="middle" class="w">celá konverzácia</text>
    <text x="215" y="70" text-anchor="middle" class="w">prompty a odpovede</text>
    <text x="215" y="95" text-anchor="middle" class="w">prečítané súbory</text>
    <text x="215" y="120" text-anchor="middle" class="w">výstupy príkazov a testov</text>
    <text x="215" y="145" text-anchor="middle" class="w">diffy, slepé uličky</text>
    <text x="215" y="170" text-anchor="middle" class="w">pokyny dané len v chate</text>
    <text x="215" y="195" text-anchor="middle" class="w">pravidlá s paths:, vnorené CLAUDE.md</text>
  </g>

  <path d="M385,195 L475,195" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="430" y="182" text-anchor="middle" class="small">/compact</text>
  <text x="430" y="215" text-anchor="middle" class="small">alebo auto</text>

  <text x="490" y="70" class="h">Po kompakcii</text>
  <g transform="translate(490,80)">
    <rect x="0" y="0" width="60" height="230" fill="#334155"/>
    <text x="30" y="118" text-anchor="middle" class="w" transform="rotate(-90 30 118)">systém + nástroje</text>
    <rect x="60" y="0" width="40" height="230" fill="#7c3aed"/>
    <text x="80" y="118" text-anchor="middle" class="w" transform="rotate(-90 80 118)">načítané z disku</text>
    <rect x="100" y="0" width="150" height="100" fill="#f59e0b"/>
    <text x="175" y="30" text-anchor="middle" class="w">štruktúrované</text>
    <text x="175" y="48" text-anchor="middle" class="w">zhrnutie</text>
    <text x="175" y="72" text-anchor="middle" fill="#fff" font-size="11">zámer, súbory, chyby,</text>
    <text x="175" y="87" text-anchor="middle" fill="#fff" font-size="11">otvorené úlohy</text>
    <rect x="100" y="100" width="150" height="45" fill="#0891b2"/>
    <text x="175" y="127" text-anchor="middle" class="w">≤ 5 posledných súborov</text>
    <rect x="100" y="145" width="150" height="35" fill="#0e7490"/>
    <text x="175" y="167" text-anchor="middle" class="w">plán, použité skills</text>
    <rect x="100" y="180" width="150" height="50" fill="#e2e8f0"/>
    <text x="175" y="210" text-anchor="middle" fill="#334155" font-size="12">voľné miesto</text>
  </g>

  <text x="40" y="345" class="small">Stratí sa: presné výstupy nástrojov, priebežné úvahy, pokyny dané len v konverzácii, pravidlá viazané na cesty (kým sa znova nespustia).</text>
  <text x="40" y="365" class="small">Prežije: všetko, čo je na disku – CLAUDE.md, auto memory, plán z plan mode, PLAN.md, kód. Preto dôležité veci patria do súborov, nie do chatu.</text>
</svg>

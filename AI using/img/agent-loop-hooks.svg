<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#475569; stroke-width:1.5; rx:10; }
      .model { fill:#e0e7ff; stroke:#4338ca; stroke-width:1.5; }
      .tool { fill:#dcfce7; stroke:#15803d; stroke-width:1.5; }
      .hook { fill:#fef3c7; stroke:#b45309; stroke-width:1.5; }
      .line { stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .hookline { stroke:#b45309; stroke-width:1.3; stroke-dasharray:4 3; fill:none; }
      .title { font-size:20px; font-weight:600; fill:#0f172a; }
      .small { font-size:12px; fill:#334155; }
      .hooktxt { font-size:12px; fill:#78350f; font-weight:600; }
    </style>
  </defs>

  <text x="450" y="32" text-anchor="middle" class="title">Agentová slučka a miesta, kde zasahujú hooks</text>

  <!-- User -->
  <rect x="30" y="170" width="130" height="60" rx="10" class="box"/>
  <text x="95" y="198" text-anchor="middle">Používateľ</text>
  <text x="95" y="216" text-anchor="middle" class="small">prompt</text>

  <!-- Model -->
  <rect x="260" y="150" width="170" height="100" rx="10" class="model"/>
  <text x="345" y="190" text-anchor="middle" font-weight="600">LLM</text>
  <text x="345" y="210" text-anchor="middle" class="small">kontext = system +</text>
  <text x="345" y="226" text-anchor="middle" class="small">pamäť + história</text>

  <!-- Tool -->
  <rect x="560" y="150" width="170" height="100" rx="10" class="tool"/>
  <text x="645" y="190" text-anchor="middle" font-weight="600">Nástroj</text>
  <text x="645" y="210" text-anchor="middle" class="small">Read / Edit / Bash</text>
  <text x="645" y="226" text-anchor="middle" class="small">MCP / subagent</text>

  <!-- Done -->
  <rect x="770" y="330" width="110" height="50" rx="10" class="box"/>
  <text x="825" y="360" text-anchor="middle">Hotovo</text>

  <!-- arrows -->
  <path d="M160,200 L258,200" class="line"/>
  <path d="M430,180 L558,180" class="line"/>
  <text x="494" y="170" text-anchor="middle" class="small">tool_use</text>
  <path d="M558,225 L432,225" class="line"/>
  <text x="494" y="245" text-anchor="middle" class="small">tool_result</text>
  <path d="M345,250 C345,350 600,355 768,355" class="line"/>
  <text x="520" y="340" text-anchor="middle" class="small">žiadny ďalší tool call → koniec ťahu</text>

  <!-- hooks -->
  <rect x="120" y="70" width="170" height="34" rx="8" class="hook"/>
  <text x="205" y="92" text-anchor="middle" class="hooktxt">UserPromptSubmit</text>
  <path d="M205,104 L205,198" class="hookline"/>

  <rect x="400" y="70" width="140" height="34" rx="8" class="hook"/>
  <text x="470" y="92" text-anchor="middle" class="hooktxt">PreToolUse</text>
  <text x="470" y="122" text-anchor="middle" class="small">môže zablokovať (exit 2)</text>
  <path d="M470,104 L470,178" class="hookline"/>

  <rect x="580" y="290" width="140" height="34" rx="8" class="hook"/>
  <text x="650" y="312" text-anchor="middle" class="hooktxt">PostToolUse</text>
  <text x="650" y="282" text-anchor="middle" class="small">formatter, lint, testy</text>
  <path d="M600,290 L520,227" class="hookline"/>

  <rect x="760" y="250" width="130" height="34" rx="8" class="hook"/>
  <text x="825" y="272" text-anchor="middle" class="hooktxt">Stop</text>
  <text x="825" y="242" text-anchor="middle" class="small">„ešte nie si hotový“</text>
  <path d="M825,284 L825,328" class="hookline"/>

  <rect x="30" y="300" width="200" height="34" rx="8" class="hook"/>
  <text x="130" y="322" text-anchor="middle" class="hooktxt">SessionStart / PreCompact</text>
  <path d="M230,317 L300,250" class="hookline"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#222">Softmax</text>

  <!-- vzorec -->
  <g font-family="Cambria Math, Times New Roman, serif" font-size="30" fill="#222">
    <text x="60" y="112" font-style="italic">p</text>
    <text x="76" y="122" font-size="18" font-style="italic">i</text>
    <text x="96" y="112">=</text>
    <text x="170" y="92" font-style="italic">e</text>
    <text x="185" y="76" font-size="18" font-style="italic">z</text>
    <text x="195" y="82" font-size="13" font-style="italic">i</text>
    <line x1="134" y1="104" x2="262" y2="104" stroke="#222" stroke-width="2"/>
    <text x="138" y="146" font-size="34">Σ</text>
    <text x="160" y="156" font-size="15" font-style="italic">j</text>
    <text x="180" y="142" font-style="italic">e</text>
    <text x="195" y="126" font-size="18" font-style="italic">z</text>
    <text x="205" y="132" font-size="13" font-style="italic">j</text>
  </g>
  <g font-size="15" fill="#555">
    <text x="300" y="86"><tspan font-style="italic">z</tspan><tspan font-size="11" font-style="italic">i</tspan> … logit (surový výstup) pre triedu i</text>
    <text x="300" y="110">každé <tspan font-style="italic">p</tspan><tspan font-size="11" font-style="italic">i</tspan> je v intervale (0, 1)</text>
    <text x="300" y="134">súčet všetkých <tspan font-style="italic">p</tspan><tspan font-size="11" font-style="italic">i</tspan> je presne 1</text>
  </g>

  <!-- priklad -->
  <text x="24" y="200" font-size="16" font-weight="bold" fill="#222">Príklad (3 triedy)</text>
  <g font-size="15" fill="#222">
    <text x="40" y="232" font-weight="bold">trieda</text>
    <text x="150" y="232" font-weight="bold">logit z</text>
    <text x="260" y="232" font-weight="bold">e^z</text>
    <text x="370" y="232" font-weight="bold">p = e^z / 64.71</text>
    <line x1="36" y1="240" x2="684" y2="240" stroke="#ccc"/>

    <text x="40" y="264">„0“</text><text x="150" y="264">4.0</text><text x="260" y="264">54.60</text><text x="370" y="264">0.844</text>
    <rect x="440" y="252" width="211" height="14" fill="#2b6cb0"/>
    <text x="40" y="288">„1“</text><text x="150" y="288">2.0</text><text x="260" y="288">7.39</text><text x="370" y="288">0.114</text>
    <rect x="440" y="276" width="28.5" height="14" fill="#2b6cb0"/>
    <text x="40" y="312">„2“</text><text x="150" y="312">1.0</text><text x="260" y="312">2.72</text><text x="370" y="312">0.042</text>
    <rect x="440" y="300" width="10.5" height="14" fill="#2b6cb0"/>
  </g>
  <text x="260" y="326" font-size="12" fill="#777">Σ = 64.71</text>
</svg>

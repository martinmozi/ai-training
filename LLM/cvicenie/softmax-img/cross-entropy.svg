<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#222">Cross-entropy loss</text>

  <!-- vzorec -->
  <g font-family="Cambria Math, Times New Roman, serif" font-size="28" fill="#222">
    <text x="40" y="88" font-style="italic">L</text>
    <text x="64" y="88">= − log</text>
    <text x="160" y="88">(</text>
    <text x="172" y="88" font-style="italic">p</text>
    <text x="188" y="96" font-size="16" font-style="italic">y</text>
    <text x="202" y="88">)</text>
  </g>
  <g font-size="14" fill="#555">
    <text x="40" y="118"><tspan font-style="italic">y</tspan> … správna trieda,</text>
    <text x="40" y="138"><tspan font-style="italic">p</tspan><tspan font-size="10" font-style="italic">y</tspan> … pravdepodobnosť,</text>
    <text x="40" y="158">ktorú jej dal softmax</text>
    <text x="40" y="186">Ostatné triedy priamo</text>
    <text x="40" y="206">nevstupujú, ale cez</text>
    <text x="40" y="226">softmax (súčet = 1)</text>
    <text x="40" y="246">sú tlačené nadol.</text>
  </g>

  <!-- graf -L(p), x: 70..470 -> posun +200 -->
  <g transform="translate(200,10)">
    <line x1="70" y1="300" x2="480" y2="300" stroke="#444"/>
    <line x1="70" y1="300" x2="70" y2="40" stroke="#444"/>
    <g font-size="12" fill="#555" text-anchor="middle">
      <text x="70" y="318">0</text><text x="170" y="318">0.25</text><text x="270" y="318">0.5</text>
      <text x="370" y="318">0.75</text><text x="470" y="318">1</text>
      <text x="270" y="340" font-size="13">p_y (pravdepodobnosť správnej triedy)</text>
    </g>
    <g font-size="12" fill="#555" text-anchor="end">
      <text x="62" y="304">0</text><text x="62" y="254">1</text><text x="62" y="204">2</text>
      <text x="62" y="154">3</text><text x="62" y="104">4</text><text x="62" y="54">5</text>
    </g>
    <text x="30" y="40" font-size="13" fill="#555">L</text>
    <g stroke="#eee">
      <line x1="70" y1="250" x2="470" y2="250"/><line x1="70" y1="200" x2="470" y2="200"/>
      <line x1="70" y1="150" x2="470" y2="150"/><line x1="70" y1="100" x2="470" y2="100"/>
    </g>
    <path fill="none" stroke="#c53030" stroke-width="2.5" d="M74.0,69.7 L75.2,82.7 L79.2,111.1 L83.1,129.1 L87.1,142.3 L91.1,152.8 L95.0,161.4 L99.0,168.8 L103.0,175.2 L106.9,180.9 L110.9,186.0 L114.9,190.6 L118.8,194.8 L122.8,198.8 L128.8,204.1 L134.7,208.9 L140.7,213.3 L146.6,217.4 L152.6,221.1 L160.5,225.7 L168.4,229.9 L176.4,233.8 L186.3,238.2 L196.2,242.3 L206.1,246.1 L218.0,250.3 L229.9,254.2 L241.8,257.8 L255.7,261.6 L269.6,265.2 L285.5,269.1 L301.4,272.6 L317.2,275.9 L335.1,279.4 L352.9,282.7 L370.8,285.7 L390.6,288.9 L410.5,291.9 L430.3,294.8 L450.2,297.5 L470.0,300.0"/>

    <!-- body z prikladu -->
    <circle cx="407.6" cy="291.5" r="5" fill="#2f855a"/>
    <text x="360" y="276" font-size="12" fill="#2f855a">p=0.844 → L=0.17</text>
    <circle cx="115.6" cy="191.4" r="5" fill="#dd6b20"/>
    <text x="124" y="186" font-size="12" fill="#dd6b20">p=0.114 → L=2.17</text>
    <circle cx="74.0" cy="69.7" r="5" fill="#c53030"/>
    <text x="84" y="70" font-size="12" fill="#c53030">p=0.01 → L=4.61</text>
    <circle cx="270" cy="265.3" r="4" fill="#555"/>
    <text x="278" y="258" font-size="12" fill="#555">p=0.5 → L=0.69</text>
  </g>
</svg>

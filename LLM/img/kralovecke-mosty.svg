<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="780" height="370" fill="#ffffff"/>
  <text x="20" y="24" font-weight="bold" font-size="14">Kráľovecké mosty (1736): Euler zahodil mapu a nechal len vrcholy a hrany</text>

  <!-- mapa -->
  <text x="20" y="50" font-weight="bold">1. Mesto: 4 pevniny, 7 mostov</text>
  <rect x="20" y="60" width="360" height="260" fill="#bfdbfe"/>
  <g fill="#fef3c7" stroke="#d97706">
    <rect x="20" y="60" width="360" height="60"/>
    <rect x="20" y="260" width="360" height="60"/>
    <rect x="285" y="150" width="95" height="80"/>
    <ellipse cx="150" cy="190" rx="75" ry="34"/>
  </g>
  <g fill="#92400e">
    <rect x="115" y="120" width="10" height="40"/>
    <rect x="175" y="120" width="10" height="40"/>
    <rect x="115" y="220" width="10" height="40"/>
    <rect x="175" y="220" width="10" height="40"/>
    <rect x="223" y="185" width="62" height="10"/>
    <rect x="330" y="120" width="10" height="30"/>
    <rect x="330" y="230" width="10" height="30"/>
  </g>
  <g font-weight="bold" font-size="16" text-anchor="middle">
    <text x="60" y="96">A</text>
    <text x="60" y="296">B</text>
    <text x="150" y="196">C</text>
    <text x="332" y="196">D</text>
  </g>
  <text x="200" y="345" text-anchor="middle" fill="#555">Dá sa prejsť každý most práve raz?</text>

  <!-- sipka -->
  <line x1="395" y1="190" x2="455" y2="190" stroke="#555" stroke-width="2"/>
  <path d="M455,184 L465,190 L455,196 z" fill="#555"/>
  <text x="430" y="178" text-anchor="middle" fill="#555" font-size="11">abstrakcia</text>

  <!-- graf -->
  <text x="480" y="50" font-weight="bold">2. Graf: vrchol = pevnina, hrana = most</text>
  <g fill="none" stroke="#2563eb" stroke-width="2">
    <path d="M590,90 Q525,125 540,190"/>
    <path d="M590,90 Q600,150 540,190"/>
    <path d="M590,290 Q525,255 540,190"/>
    <path d="M590,290 Q600,230 540,190"/>
    <line x1="540" y1="190" x2="710" y2="190"/>
    <line x1="590" y1="90" x2="710" y2="190"/>
    <line x1="590" y1="290" x2="710" y2="190"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <circle cx="590" cy="90" r="16"/>
    <circle cx="590" cy="290" r="16"/>
    <circle cx="540" cy="190" r="16"/>
    <circle cx="710" cy="190" r="16"/>
  </g>
  <g font-weight="bold" text-anchor="middle">
    <text x="590" y="95">A</text>
    <text x="590" y="295">B</text>
    <text x="540" y="195">C</text>
    <text x="710" y="195">D</text>
  </g>
  <g fill="#b91c1c" font-size="12">
    <text x="612" y="78">stupeň 3</text>
    <text x="612" y="315">stupeň 3</text>
    <text x="470" y="170">stupeň 5</text>
    <text x="682" y="222">stupeň 3</text>
  </g>
  <text x="600" y="345" text-anchor="middle" fill="#555">Ťah cez všetky hrany existuje len pri 0 alebo 2</text>
  <text x="600" y="362" text-anchor="middle" fill="#555">vrcholoch nepárneho stupňa. Tu sú 4 → nedá sa.</text>
</svg>

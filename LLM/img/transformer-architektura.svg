<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" width="780" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="780" height="700" fill="#ffffff"/>

  <!-- vstup -->
  <text x="260" y="32" text-anchor="middle" font-weight="bold">Vstup: n tokenov (tu n = 3)</text>
  <rect x="105" y="45" width="90" height="30" rx="5" fill="#eeeeee" stroke="#999"/>
  <rect x="215" y="45" width="90" height="30" rx="5" fill="#eeeeee" stroke="#999"/>
  <rect x="325" y="45" width="90" height="30" rx="5" fill="#eeeeee" stroke="#999"/>
  <text x="150" y="65" text-anchor="middle">Mačka</text>
  <text x="260" y="65" text-anchor="middle">sedí</text>
  <text x="370" y="65" text-anchor="middle">na</text>
  <text x="450" y="65" fill="#555">tokenizer: text → čísla tokenov (pevne dané)</text>

  <g stroke="#555" marker-end="url(#a)">
    <line x1="150" y1="75" x2="150" y2="108"/>
    <line x1="260" y1="75" x2="260" y2="108"/>
    <line x1="370" y1="75" x2="370" y2="108"/>
  </g>

  <!-- embedding -->
  <rect x="95" y="110" width="330" height="40" rx="6" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="260" y="135" text-anchor="middle" font-weight="bold">Embedding tabuľka</text>
  <text x="450" y="126">Embedding: 100 352 × 4096 čísel</text>
  <text x="450" y="144" fill="#555">každý token → vektor dĺžky 4096 (d_model)</text>

  <g stroke="#555" marker-end="url(#a)">
    <line x1="150" y1="150" x2="150" y2="163"/>
    <line x1="260" y1="150" x2="260" y2="163"/>
    <line x1="370" y1="150" x2="370" y2="163"/>
  </g>
  <rect x="120" y="165" width="60" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="230" y="165" width="60" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="340" y="165" width="60" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="180" text-anchor="middle">x₁</text>
  <text x="260" y="180" text-anchor="middle">x₂</text>
  <text x="370" y="180" text-anchor="middle">x₃</text>

  <!-- blok -->
  <rect x="80" y="195" width="360" height="300" rx="10" fill="none" stroke="#777" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="92" y="213" font-size="12" font-weight="bold" fill="#444">Blok transformera – opakuje sa 32× (OLMo 2 7B)</text>

  <!-- attention -->
  <rect x="95" y="222" width="330" height="98" rx="6" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="260" y="240" text-anchor="middle" font-weight="bold">Self-attention  (W_Q, W_K, W_V, W_O)</text>
  <g stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)" fill="none">
    <line x1="150" y1="252" x2="150" y2="310"/>
    <line x1="150" y1="252" x2="256" y2="310"/>
    <line x1="150" y1="252" x2="366" y2="310"/>
    <line x1="260" y1="252" x2="260" y2="310"/>
    <line x1="260" y1="252" x2="368" y2="310"/>
    <line x1="370" y1="252" x2="370" y2="310"/>
  </g>
  <text x="450" y="240">Tu si tokeny vymieňajú informácie.</text>
  <text x="450" y="258" fill="#555">Každý token sa „pozrie“ na seba a na</text>
  <text x="450" y="276" fill="#555">všetky predchádzajúce tokeny.</text>
  <text x="450" y="294" fill="#2563eb">Váhy pozornosti (modré šípky) sa počítajú</text>
  <text x="450" y="312" fill="#2563eb">pre každý vstup nanovo – nie sú učené.</text>

  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#666">+ reziduálne spojenie, RMSNorm</text>

  <!-- FFN -->
  <g stroke="#555" marker-end="url(#a)">
    <line x1="150" y1="320" x2="150" y2="348"/>
    <line x1="260" y1="320" x2="260" y2="348"/>
    <line x1="370" y1="320" x2="370" y2="348"/>
  </g>
  <rect x="110" y="350" width="80" height="70" rx="6" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <rect x="220" y="350" width="80" height="70" rx="6" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <rect x="330" y="350" width="80" height="70" rx="6" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="150" y="381" font-weight="bold">FFN</text>
    <text x="260" y="381" font-weight="bold">FFN</text>
    <text x="370" y="381" font-weight="bold">FFN</text>
    <text x="150" y="399" font-size="11">SwiGLU</text>
    <text x="260" y="399" font-size="11">SwiGLU</text>
    <text x="370" y="399" font-size="11">SwiGLU</text>
  </g>
  <text x="450" y="362">Feed-forward sieť: každý token zvlášť.</text>
  <text x="450" y="380" fill="#555">Všetky tri boxy sú TÁ ISTÁ sieť</text>
  <text x="450" y="398" fill="#555">(rovnaké váhy W_gate, W_up, W_down).</text>
  <text x="450" y="416" fill="#555">Tokeny sa tu navzájom neovplyvňujú.</text>

  <text x="260" y="437" text-anchor="middle" font-size="11" fill="#666">+ reziduálne spojenie, RMSNorm</text>
  <g stroke="#555" marker-end="url(#a)">
    <line x1="150" y1="420" x2="150" y2="453"/>
    <line x1="260" y1="420" x2="260" y2="453"/>
    <line x1="370" y1="420" x2="370" y2="453"/>
  </g>
  <rect x="120" y="455" width="60" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="230" y="455" width="60" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="340" y="455" width="60" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="470" text-anchor="middle">h₁</text>
  <text x="260" y="470" text-anchor="middle">h₂</text>
  <text x="370" y="470" text-anchor="middle">h₃</text>
  <text x="450" y="470" fill="#555">výstup bloku → vstup ďalšieho bloku</text>

  <!-- výstup -->
  <g stroke="#555" marker-end="url(#a)">
    <line x1="150" y1="475" x2="150" y2="513"/>
    <line x1="260" y1="475" x2="260" y2="513"/>
    <line x1="370" y1="475" x2="370" y2="513"/>
  </g>
  <rect x="95" y="515" width="330" height="40" rx="6" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="260" y="540" text-anchor="middle" font-weight="bold">RMSNorm + výstupná vrstva (LM head)</text>
  <text x="450" y="531">LM head: 4096 × 100 352 čísel</text>
  <text x="450" y="549" fill="#555">vektor → skóre pre každý token slovníka</text>

  <line x1="370" y1="555" x2="370" y2="573" stroke="#555" marker-end="url(#a)"/>
  <rect x="290" y="575" width="160" height="62" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="370" y="593" text-anchor="middle" font-weight="bold">softmax → ďalší token</text>
  <text x="370" y="611" text-anchor="middle">„stole“ 41 %</text>
  <text x="370" y="627" text-anchor="middle">„zemi“ 18 %  …</text>
  <text x="100" y="593" font-size="11" fill="#666">výstupy tokenov 1 a 2 sa pri</text>
  <text x="100" y="608" font-size="11" fill="#666">generovaní zahodia, pri tréningu</text>
  <text x="100" y="623" font-size="11" fill="#666">každý predpovedá svoj ďalší token</text>

  <!-- legenda -->
  <rect x="20" y="660" width="18" height="18" rx="3" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="46" y="674">učené parametre (menia sa počas tréningu)</text>
  <rect x="340" y="660" width="18" height="18" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="366" y="674">počíta sa pre každý vstup</text>
  <rect x="560" y="660" width="18" height="18" rx="3" fill="#eeeeee" stroke="#999"/>
  <text x="586" y="674">pevne dané (neučí sa)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="780" height="390" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="780" height="390" fill="#ffffff"/>
  <text x="20" y="24" font-weight="bold" font-size="14">KV cache: K a V starších tokenov sa uložia a už sa znova nepočítajú</text>

  <!-- krok 1 -->
  <text x="20" y="54" font-weight="bold">1. Prefill – celý prompt naraz (paralelne)</text>
  <rect x="40" y="66" width="80" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="140" y="66" width="80" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="240" y="66" width="80" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="80" y="85" text-anchor="middle">Mačka</text>
  <text x="180" y="85" text-anchor="middle">sedí</text>
  <text x="280" y="85" text-anchor="middle">na</text>
  <line x1="320" y1="80" x2="355" y2="80" stroke="#555" marker-end="url(#a)"/>
  <text x="362" y="85">predikcia: „stole“</text>
  <g stroke="#555" marker-end="url(#a)">
    <line x1="80" y1="94" x2="80" y2="128"/>
    <line x1="180" y1="94" x2="180" y2="128"/>
    <line x1="280" y1="94" x2="280" y2="128"/>
  </g>
  <text x="300" y="116" font-size="11" fill="#555">uložia sa K, V</text>

  <!-- cache -->
  <rect x="25" y="122" width="430" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="40" y="132" width="80" height="36" rx="4" fill="#fff" stroke="#16a34a"/>
  <rect x="140" y="132" width="80" height="36" rx="4" fill="#fff" stroke="#16a34a"/>
  <rect x="240" y="132" width="80" height="36" rx="4" fill="#fff" stroke="#16a34a"/>
  <rect x="340" y="132" width="80" height="36" rx="4" fill="#fde7d4" stroke="#e07a1f" stroke-dasharray="4 3"/>
  <g text-anchor="middle">
    <text x="80" y="155">K₁ V₁</text>
    <text x="180" y="155">K₂ V₂</text>
    <text x="280" y="155">K₃ V₃</text>
    <text x="380" y="155">K₄ V₄</text>
  </g>
  <text x="475" y="146" font-weight="bold" fill="#15803d">KV cache</text>
  <text x="475" y="164" font-size="12" fill="#555">(pre každú vrstvu zvlášť, v pamäti GPU)</text>

  <!-- krok 2 -->
  <text x="20" y="215" font-weight="bold">2. Generovanie – spracuje sa iba nový token</text>
  <rect x="340" y="300" width="80" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="319" text-anchor="middle">stole</text>
  <text x="430" y="319" font-size="11" fill="#555">nový token</text>
  <line x1="380" y1="300" x2="380" y2="172" stroke="#e07a1f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="300" y="262" font-size="11" fill="#c2410c">pridá K₄ V₄</text>

  <rect x="520" y="236" width="70" height="28" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="555" y="255" text-anchor="middle" font-weight="bold">Q₄</text>
  <line x1="420" y1="306" x2="518" y2="262" stroke="#555" marker-end="url(#a)"/>

  <g stroke="#2563eb" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ab)">
    <line x1="530" y1="236" x2="84" y2="170"/>
    <line x1="535" y1="236" x2="184" y2="170"/>
    <line x1="540" y1="236" x2="284" y2="170"/>
    <line x1="545" y1="236" x2="400" y2="170"/>
  </g>
  <text x="600" y="232" font-size="12" fill="#2563eb">Q₄ sa porovná so</text>
  <text x="600" y="247" font-size="12" fill="#2563eb">všetkými K v cache</text>
  <line x1="590" y1="270" x2="625" y2="285" stroke="#555" marker-end="url(#a)"/>
  <text x="630" y="294">predikcia: „a“</text>

  <text x="20" y="360" font-size="12" fill="#444">Bez cache by sa pri každom novom tokene celý text prepočítal odznova.</text>
  <text x="20" y="378" font-size="12" fill="#444">S cache sa v každom kroku počíta iba 1 token, attention len číta stále dlhšiu cache.</text>
</svg>

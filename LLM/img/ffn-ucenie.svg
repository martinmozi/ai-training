  <rect width="820" height="450" fill="#ffffff"/>
  <text x="20" y="26" font-weight="bold" font-size="14">Jeden krok učenia: dopredu → chyba → späť → úprava váh, a znova</text>
  <rect x="40" y="60" width="270" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="82" text-anchor="middle" font-weight="bold">1. dopredný priechod</text>
  <text x="175" y="100" text-anchor="middle" font-size="12" fill="#444">x → vrstvy → predikcia</text>
  <rect x="40" y="160" width="270" height="52" rx="6" fill="#f3f4f6" stroke="#999" stroke-width="1.5"/>
  <text x="175" y="182" text-anchor="middle" font-weight="bold">2. chyba (loss)</text>
  <text x="175" y="200" text-anchor="middle" font-size="12" fill="#444">ako ďaleko je predikcia od cieľa</text>
  <rect x="40" y="260" width="270" height="52" rx="6" fill="#fde7d4" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="175" y="282" text-anchor="middle" font-weight="bold">3. spätné šírenie</text>

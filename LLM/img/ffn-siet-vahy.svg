      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="820" height="520" fill="#ffffff"/>
  <text x="20" y="26" font-weight="bold" font-size="14">Feed-forward sieť 3 → 4 → 2: každá čiara je jedna váha (jedno naučené číslo)</text>
